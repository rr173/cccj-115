[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "handover-iblt"
version = "1.0.0"
description = "Reconciling handover of specimen checklists with capped-size IBLT digests on SQLite"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Reserve Data Tools" }]
dependencies = []

[project.optional-dependencies]
test = ["pytest>=7"]

[project.scripts]
handover-iblt = "handover_iblt.cli:main"

[tool.setuptools.packages.find]
include = ["handover_iblt*"]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]
