[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "dwca-archive"
version = "1.0.0"
description = "Streaming, attribution-tracked Darwin Core Archive (DwC-A) subset importer on SQLite"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Reserve Data Tools" }]
dependencies = []

[project.optional-dependencies]
test = ["pytest>=7"]

[project.scripts]
dwca = "dwca.cli:main"

[tool.setuptools.packages.find]
include = ["dwca*"]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]
